# Build and tests (./dev ./gradlew build) and the network's end-to-end tests (tools/network.sh test),
# both through the Nix dev shell, as on a developer machine (AGENTS.md); and the hermetic Nix build
# (nix flake check and the flake's packages).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nix store cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-build-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-build-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-build-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Dev shell
        run: ./dev true

      # Caches ~/.gradle (dependencies, wrapper); the JDK is Nix's (gradle.properties: no auto-download)
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: ./dev ./gradlew --console=plain build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  # The hermetic Nix build (AGENTS.md, nix/gradle.nix): `gradlew build` with all tests in the Nix
  # sandbox and the flake's packages, from the locked dependencies in nix/gradle-deps.json, so the
  # lock cannot rot unnoticed.
  nix:
    name: Nix flake check and packages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nix store cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-flake-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-flake-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-flake-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # A dependency missing from (or changed against) nix/gradle-deps.json shows up as a download
      # that mitm-cache cannot serve, or as a hash mismatch of the cache itself.
      # Each package is its own Gradle build in its own sandbox: more than two at once exhaust the
      # runner's memory (the job gets killed).
      - name: Packages
        run: |
          nix build -L --keep-going --no-link --max-jobs 2 \
            .#backend .#frontend-web .#velocity-example-plugin .#libs .#mods .#fabric-server-launcher \
            .#postgres-image .#runtime-image 2>&1 | tee nix-build.log
          exit "${PIPESTATUS[0]}"

      - name: Flake check
        run: |
          nix flake check -L --keep-going 2>&1 | tee nix-check.log
          exit "${PIPESTATUS[0]}"

      - name: Hint on out-of-date dependency lock
        if: failure()
        run: |
          if grep -E -q "Could not (resolve|find|GET|HEAD|download)|Received status code 404|hash mismatch in fixed-output derivation|Failed to (download|fetch)" nix-*.log 2>/dev/null; then
            echo "::error file=nix/gradle-deps.json::nix/gradle-deps.json looks out of date (a download mitm-cache cannot serve, or a changed hash). Re-record it with \`nix run .#update-gradle-deps\` in the repository root and commit the JSON (AGENTS.md, Hermetic Nix build)."
          else
            echo "::error::The hermetic Nix build failed. If it is a missing dependency, re-record nix/gradle-deps.json with \`nix run .#update-gradle-deps\` (AGENTS.md, Hermetic Nix build)."
          fi

      - name: Upload Nix logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nix-logs
          path: nix-*.log
          if-no-files-found: ignore

  network:
    name: Network tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The Minecraft EULA (https://aka.ms/MinecraftEULA), accepted by the project for its test network.
      BLOCKS_ACCEPT_EULA: "true"
    steps:
      - uses: actions/checkout@v4

      # Rootless podman (Nix's, nix/podman.nix) needs the host's setuid newuidmap/newgidmap and
      # subordinate id ranges; Ubuntu 24.04 also restricts unprivileged user namespaces to programs
      # with an AppArmor profile, which Nix store paths do not have.
      - name: Rootless podman prerequisites
        run: |
          command -v newuidmap newgidmap || { sudo apt-get update && sudo apt-get install -y uidmap; }
          user=$(id -un)
          grep -q "^$user:" /etc/subuid || echo "$user:100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$user:" /etc/subgid || echo "$user:100000:65536" | sudo tee -a /etc/subgid
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          grep "^$user:" /etc/subuid /etc/subgid
          # WireGuard in the compose network (nix/wg-up.sh): the kernel module if the runner has it,
          # userspace wireguard-go on /dev/net/tun otherwise
          sudo modprobe wireguard || echo "no wireguard kernel module: wireguard-go"
          ls -l /dev/net/tun

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nix store cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-network-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-network-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-network-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Dev shell
        run: ./dev podman info

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Network tests
        run: tools/network.sh test

      # tests that need a service the network lacks are skipped, not failed: show the counts
      - name: Test summary
        if: always()
        run: |
          {
            echo '| Test class | Tests | Skipped | Failures | Errors |'
            echo '| --- | --- | --- | --- | --- |'
            for f in e2e/build/test-results/test/TEST-*.xml; do
              [ -f "$f" ] || continue
              sed -n 's/.*<testsuite name="\([^"]*\)" tests="\([0-9]*\)" skipped="\([0-9]*\)" failures="\([0-9]*\)" errors="\([0-9]*\)".*/| \1 | \2 | \3 | \4 | \5 |/p' "$f"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            e2e/build/reports/
            e2e/build/test-results/
            e2e/build/e2e-clients/*/client.log
            e2e/build/e2e-clients/*/screenshots/
            e2e/build/e2e-clients/*/sway/sway.log
            e2e/build/scenario-diagnostics/
          if-no-files-found: ignore

      - name: Container logs
        if: failure()
        run: |
          mkdir -p network-logs
          ./dev podman ps -a > network-logs/ps.txt 2>&1 || true
          tools/network.sh logs > network-logs/compose.log 2>&1 || true

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: network-logs
          path: network-logs/
          if-no-files-found: ignore

      - name: Network down
        if: always()
        run: tools/network.sh down -v || true
