[versions]
java = "25"
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.12.0"
ktor = "3.6.1"
compose = "1.12.2"
logback = "1.6.6"
postgresql = "42.7.14"
hikaricp = "7.1.0"
junit = "6.1.3"
caffeine = "3.3.1" # pgecs plan cache
endive = "1.2.0" # JVM Wasm runtime for egglog (libs/pgecs-eqsat); keep nix/egglog-redline.nix on the same version
# Matrix bot (backend). vodozemac is built to wasm by Nix (nix/vodozemac-wasm.nix): bump its
# tag together with trixnity (vodozemac-tag in Trixnity's gradle/libs.versions.toml).
trixnity = "5.10.1"
r2dbc-postgresql = "1.1.3.RELEASE"
kord = "0.18.1" # Discord (backend/discord)
ksp = "2.3.13" # pgecs-ksp (KSP2, independent of the Kotlin version)

# Minecraft / Fabric
minecraft = "26.3"
# SHA-1 of 26.3's version JSON (piston-meta.mojang.com/v1/packages/<sha1>/<minecraft>.json, listed in
# Mojang's version_manifest_v2.json): Loom reads this fixed file instead of the mutable manifest
mojang-version-json-sha1 = "80608ff6753705b6a82e2cb86a5937d4d233abd4"
fabric-loader = "0.20.1"
fabric-api = "0.165.2+26.3"
fabric-kotlin = "1.14.2+kotlin.2.4.21"
loom = "1.19.3"

# Velocity
velocity = "4.3.1"
# proxy server jar: PaperMC build and its SHA-256 (fill.papermc.io/v3/projects/velocity/versions/<v>/builds)
velocity-proxy-build = "45"
velocity-proxy-sha256 = "0844bcabdcdb4f5b875906fd4c3365bc1bb76918e42bc595ed88ad195258dd75"
fabric-installer = "1.1.2"

# Server mods (Modrinth version ids, all for Minecraft 26.3)
mod-fabricproxy-lite = "CsEpiziv" # 2.12.0
mod-vmp = "2TFDVjDf" # 0.2.0+beta.7.238+26.3
mod-async = "gcduhoHv" # 0.2.5+alpha-26.3
mod-c2me = "Vhj7rn6M" # 0.4.2-alpha.0.115+26.3
mod-scalablelux = "g4eqNSKd" # 0.3.0-alpha.0.6+26.3
mod-ferritecore = "d5ddUdiB" # 9.0.0-fabric

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
compose-compiler-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
loom-gradle-plugin = { module = "net.fabricmc:fabric-loom", version.ref = "loom" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
endive-runtime = { module = "run.endive:runtime", version.ref = "endive" }
endive-wasi = { module = "run.endive:wasi", version.ref = "endive" }
asm = { module = "org.ow2.asm:asm", version = "9.10.1" } # build-time rewrite of trixnity-vodozemac-jvm
endive-build-time-compiler = { module = "run.endive:build-time-compiler", version.ref = "endive" }
endive-redline-runner = { module = "run.endive:redline-runner-experimental", version.ref = "endive" }
kord-rest = { module = "dev.kord:kord-rest", version.ref = "kord" }

trixnity-bom = { module = "de.connect2x.trixnity:trixnity-bom", version.ref = "trixnity" }
trixnity-vodozemac-jvm = { module = "de.connect2x.trixnity:trixnity-vodozemac-jvm", version.ref = "trixnity" } # rewritten onto Endive (libs/vodozemac-endive)
trixnity-client = { module = "de.connect2x.trixnity:trixnity-client" }
trixnity-client-cryptodriver-vodozemac = { module = "de.connect2x.trixnity:trixnity-client-cryptodriver-vodozemac" }
trixnity-client-repository-exposed = { module = "de.connect2x.trixnity:trixnity-client-repository-exposed" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version.ref = "r2dbc-postgresql" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-kotlin" }

velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }

mod-fabricproxy-lite = { module = "maven.modrinth:fabricproxy-lite", version.ref = "mod-fabricproxy-lite" }
mod-vmp = { module = "maven.modrinth:vmp-fabric", version.ref = "mod-vmp" }
mod-async = { module = "maven.modrinth:async", version.ref = "mod-async" }
mod-c2me = { module = "maven.modrinth:c2me-fabric", version.ref = "mod-c2me" }
mod-scalablelux = { module = "maven.modrinth:scalablelux", version.ref = "mod-scalablelux" }
mod-ferritecore = { module = "maven.modrinth:ferrite-core", version.ref = "mod-ferritecore" }

