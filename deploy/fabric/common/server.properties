# Shared by every Fabric server of the local network; only reachable through the edge Velocity proxies.
online-mode=false
enforce-secure-profile=false
network-compression-threshold=-1
spawn-protection=0
view-distance=8
simulation-distance=6
sync-chunk-writes=false
enable-rcon=false
# Minecraft 26.3 turns the whitelist on by default; access control is Velocity's job
white-list=false
