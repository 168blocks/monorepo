# The player zone of the local network (docs/dns.md, format: dns/src/main/kotlin/.../DnsConfig.kt).
# PowerDNS answers it on 127.0.0.1:$BLOCKS_DNS_PORT (tools/instance.sh), e.g.
#   dig @127.0.0.1 -p 10053 +subnet=198.51.100.0/24 _minecraft._tcp.play.168blocks.test SRV
zone 168blocks.test
geo-name play
ttl 60
max-answers 4
hostmaster hostmaster
nameserver ns1 127.0.0.1

# regions and their fallbacks, nearest first (asia has no edge here: it falls back to us, then eu)
region eu us asia
region us eu asia
region asia us eu
default-region eu

# client subnets (EDNS client subnet, else the resolver's address) -> region; the documentation ranges
# stand in for real ones here
prefix 192.0.2.0/24 eu
prefix 2001:db8:1::/48 eu
prefix 198.51.100.0/24 us
prefix 203.0.113.0/24 asia

# edges: name region public-address port [probe=host:port]. Locally all edges are published on 127.0.0.1
# with their own port (SRV records carry it). The probe is the dns service's status ping, from the core
# namespace over `wan`; edge 3 is probed through its L4 filter, like players reach it.
edge edge-1 eu 127.0.0.1 ${BLOCKS_EDGE1_PORT:-25501} probe=edge-1:25565
edge edge-2 us 127.0.0.1 ${BLOCKS_EDGE2_PORT:-25502} probe=edge-2:25565
edge edge-3 eu 127.0.0.1 ${BLOCKS_EDGE3_PORT:-25503} probe=edge-3-filter:25565
