# PowerDNS authoritative server for the player zone (docs/dns.md). It holds no data: every answer comes
# from the dns service (dns/, Kotlin) through the remote backend's HTTP connector, over localhost in the
# core namespace (deploy/compose.yaml). Mounted at /etc/pdns/pdns.conf of the pdns image (flake.nix).
launch=remote
remote-connection-string=http:url=http://127.0.0.1:8053/dns,post,post_json,timeout=2000
remote-dnssec=no

local-address=0.0.0.0, ::
local-port=53
daemon=no
guardian=no
disable-syslog=yes
socket-dir=/tmp
loglevel=4
# no outbound DNS query for the security status at startup
security-poll-suffix=

# GeoDNS: pass the resolver's EDNS client subnet to the backend (real-remote) and echo the scope back
edns-subnet-processing=yes
# Answers depend on the client and on edge health that changes within seconds; the records carry a 60 s
# TTL for resolvers. PowerDNS itself caches nothing (its packet and query caches ignore the client).
cache-ttl=0
query-cache-ttl=0
negquery-cache-ttl=0
zone-cache-refresh-interval=0
