# Stand-in for an L4 DDoS filter in front of an edge (edge 3 in the local network): forwards player
# connections to its edge Velocity, prepending a PROXY protocol v2 header with the player's real
# address; that edge runs with haproxy-protocol = true.
global
    log stdout format raw local0 info
    # keeps the needed file descriptors under common container limits (ulimit -n 4096)
    maxconn 1500

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 120s
    timeout server 120s

frontend minecraft
    bind :25565
    default_backend edge

backend edge
    server edge edge-3:25565 send-proxy-v2 check inter 5s
