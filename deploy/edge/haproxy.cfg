# Edge ingest proxy (one per region in production). Accepts player connections and forwards them to the
# main Velocity proxy, prepending a PROXY protocol v2 header so Velocity sees the real address.
#
# TLS termination: production edges will also accept TLS (see docs/architecture.md, "Edge proxies");
# the vanilla client speaks plain TCP, so the local network uses the plain listener only.
global
    log stdout format raw local0 info
    # keeps the needed file descriptors under common container limits (ulimit -n 4096)
    maxconn 1500

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 120s
    timeout server 120s

frontend minecraft
    bind :25565
    default_backend velocity

backend velocity
    server main velocity:25565 send-proxy-v2 check inter 5s
